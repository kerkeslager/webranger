{% extends 'core/base.html' %}
{% load static %}

{% block main %}
<link rel='stylesheet' href='{% static "editor/editor.css" %}' />
<div id='editor'></div>

<script type='module'>
  import { render, h } from 'preact';
  import { default as htm } from 'htm';
  import { Editor } from 'editor';

  const html = htm.bind(h);

  render(html`<${Editor} />`, document.getElementById('editor'));
</script>
{% endblock %}
